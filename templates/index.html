<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111214;
      color: #e1e4e8;
      min-height: 100vh;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; color: #fff; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      background: #1a1c1f;
      border-radius: 10px;
      padding: 3px;
    }
    .tab {
      flex: 1;
      padding: 9px 16px;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab:hover { color: #e1e4e8; }
    .tab.active { color: #fff; background: #2a2d31; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card {
      background: #1a1c1f;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 0.95rem; color: #c9d1d9; margin-bottom: 14px; }

    /* Add URL form */
    .add-form { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-form input {
      background: #111214;
      border: 1px solid #2a2d31;
      color: #e1e4e8;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-form input:focus { border-color: #4f8cff; }
    .add-form input[name="url"] { flex: 1; min-width: 280px; font-family: monospace; }
    .add-form input[name="label"] { width: 160px; }

    /* Buttons */
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4f8cff; color: #fff; }
    .btn-danger { background: transparent; color: #f85149; border: 1px solid #30363d; font-size: 0.8rem; padding: 5px 10px; }
    .btn-danger:hover { background: #f8514920; }
    .btn-secondary { background: #2a2d31; color: #e1e4e8; }

    /* URL list */
    .url-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #21262d;
      gap: 12px;
    }
    .url-row:last-child { border-bottom: none; }

    .url-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-debank { background: #1c3a5f; color: #58a6ff; }
    .badge-jupiter { background: #2a1f4e; color: #bc8cff; }

    .url-info { flex: 1; min-width: 0; }
    .url-label { font-weight: 500; font-size: 0.9rem; margin-bottom: 2px; }
    .url-link {
      font-family: monospace;
      font-size: 0.75rem;
      color: #6e7681;
      word-break: break-all;
    }
    .url-link a { color: #4f8cff; text-decoration: none; }
    .url-link a:hover { text-decoration: underline; }

    /* Screenshot gallery */
    .screenshots-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .screenshot-card {
      background: #1a1c1f;
      border-radius: 12px;
      overflow: hidden;
    }
    .screenshot-card .sc-header { padding: 12px 16px; border-bottom: 1px solid #21262d; }
    .screenshot-card .sc-label { font-weight: 500; font-size: 0.85rem; }
    .screenshot-card img { width: 100%; display: block; cursor: pointer; }
    .screenshot-card img:hover { opacity: 0.9; }

    /* Settings form */
    .settings-form { display: flex; flex-direction: column; gap: 12px; }
    .settings-form label { font-size: 0.8rem; color: #6e7681; display: block; margin-bottom: 4px; }
    .settings-form input {
      background: #111214;
      border: 1px solid #2a2d31;
      color: #e1e4e8;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
      max-width: 400px;
    }
    .settings-form input:focus { border-color: #4f8cff; }

    .empty-state { padding: 40px 20px; text-align: center; color: #484f58; font-size: 0.9rem; }
    .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 10px 18px; border-radius: 8px; font-size: 0.85rem;
      z-index: 1000; transform: translateY(80px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #238636; color: #fff; }
    .toast.error { background: #da3633; color: #fff; }

    /* Lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.92); z-index: 2000;
      justify-content: center; align-items: center; cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 8px; }

    @media (max-width: 600px) {
      .add-form { flex-direction: column; }
      .add-form input { width: 100% !important; min-width: auto !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portfolio Tracker</h1>

    <div class="tabs">
      <button class="tab active" data-tab="urls">URLs</button>
      <button class="tab" data-tab="balances">Balances</button>
      <button class="tab" data-tab="screenshots">Screenshots</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <!-- URLs Tab -->
    <div class="tab-content active" id="tab-urls">
      <div class="card">
        <h2>Add URL</h2>
        <form class="add-form" id="addForm">
          <input type="text" name="url" placeholder="Paste DeBank or Jupiter URL..." required>
          <input type="text" name="label" placeholder="Label (optional)">
          <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
        </form>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;">Tracked URLs</h2>
          <span id="urlCount" style="color:#6e7681;font-size:0.8rem;"></span>
        </div>
        <div id="urlList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Balances Tab -->
    <div class="tab-content" id="tab-balances">
      <div class="actions">
        <button class="btn btn-primary" onclick="fetchBalances()" id="balanceBtn">Fetch Balances</button>
        <a class="btn btn-secondary" href="/report" target="_blank" style="text-decoration:none;display:inline-block;">View Report</a>
      </div>
      <div id="balancesList">
        <div class="empty-state">Click "Fetch Balances" to load wallet data.</div>
      </div>
    </div>

    <!-- Screenshots Tab -->
    <div class="tab-content" id="tab-screenshots">
      <div class="actions">
        <button class="btn btn-secondary" onclick="captureScreenshots()" id="captureBtn">Capture All</button>
        <button class="btn btn-primary" onclick="captureAndEmail()" id="emailBtn">Capture &amp; Email</button>
      </div>
      <div id="screenshotsList" class="screenshots-grid">
        <div class="empty-state">No screenshots yet.</div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content" id="tab-settings">
      <div class="card">
        <h2>Email Settings</h2>
        <p style="color:#6e7681;font-size:0.8rem;margin-bottom:16px;">
          Configure where reports get emailed. For Gmail, use an
          <a href="https://myaccount.google.com/apppasswords" target="_blank" style="color:#4f8cff;">App Password</a>.
        </p>
        <form class="settings-form" id="emailForm">
          <div>
            <label>Recipient Email</label>
            <input type="email" name="recipient" placeholder="you@example.com" required>
          </div>
          <div>
            <label>SMTP User (sender email)</label>
            <input type="email" name="smtp_user" placeholder="sender@gmail.com" required>
          </div>
          <div>
            <label>SMTP Password / App Password</label>
            <input type="password" name="smtp_password" placeholder="xxxx xxxx xxxx xxxx" required>
          </div>
          <div>
            <label>SMTP Host</label>
            <input type="text" name="smtp_host" value="smtp.gmail.com">
          </div>
          <div>
            <label>SMTP Port</label>
            <input type="number" name="smtp_port" value="587">
          </div>
          <button type="submit" class="btn btn-primary" style="align-self:flex-start;margin-top:8px;">Save</button>
        </form>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* Tabs */
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'screenshots') loadScreenshots();
        if (btn.dataset.tab === 'settings') loadEmailSettings();
      });
    });

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + type + ' show';
      setTimeout(() => el.classList.remove('show'), 3500);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function detectSource(url) {
      if (url.includes('debank.com')) return 'debank';
      if (url.includes('jup.ag')) return 'jupiter';
      return 'other';
    }

    /* --- URLs --- */
    async function loadUrls() {
      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();
        renderUrls(urls);
      } catch (e) {
        document.getElementById('urlList').innerHTML = '<div class="empty-state">Failed to load</div>';
      }
    }

    function renderUrls(urls) {
      const container = document.getElementById('urlList');
      document.getElementById('urlCount').textContent = urls.length + ' URL' + (urls.length !== 1 ? 's' : '');

      if (!urls.length) {
        container.innerHTML = '<div class="empty-state">No URLs added yet.</div>';
        return;
      }

      container.innerHTML = urls.map(u => {
        const src = detectSource(u.url);
        const badge = src === 'debank'
          ? '<span class="url-badge badge-debank">DeBank</span>'
          : '<span class="url-badge badge-jupiter">Jupiter</span>';
        const label = (u.label && u.label !== u.url) ? '<div class="url-label">' + esc(u.label) + '</div>' : '';

        return '<div class="url-row">'
          + badge
          + '<div class="url-info">' + label
          + '<div class="url-link"><a href="' + esc(u.url) + '" target="_blank">' + esc(u.url) + '</a></div>'
          + '</div>'
          + '<button class="btn btn-danger" onclick="removeUrl(\'' + esc(u.url).replace(/'/g, "\\'") + '\')">Remove</button>'
          + '</div>';
      }).join('');
    }

    /* Add URL */
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = { url: form.url.value.trim(), label: form.label.value.trim() };
      if (!data.url) return;

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = 'Adding...';

      try {
        const res = await fetch('/api/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (res.ok) {
          toast('URL added');
          form.reset();
          loadUrls();
        } else {
          toast(result.error || 'Failed', 'error');
        }
      } catch (err) {
        toast('Network error', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add';
      }
    });

    /* Remove URL */
    async function removeUrl(url) {
      if (!confirm('Remove this URL?')) return;
      try {
        const res = await fetch('/api/urls', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url }),
        });
        if (res.ok) { toast('Removed'); loadUrls(); }
        else { const r = await res.json(); toast(r.error || 'Failed', 'error'); }
      } catch (err) { toast('Network error', 'error'); }
    }

    /* --- Screenshots --- */
    async function captureScreenshots() {
      const btn = document.getElementById('captureBtn');
      btn.disabled = true;
      btn.textContent = 'Capturing...';
      try {
        const res = await fetch('/api/screenshots/capture', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          const ok = data.results.filter(r => !r.error).length;
          const failed = data.results.filter(r => r.error);
          if (failed.length) {
            toast('Captured ' + ok + ', ' + failed.length + ' failed', ok ? 'success' : 'error');
          } else {
            toast('Captured ' + ok + ' screenshot(s)');
          }
          loadScreenshots();
        } else { toast(data.error || 'Failed', 'error'); }
      } catch (err) { toast('Capture failed', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Capture All'; }
    }

    async function captureAndEmail() {
      const btn = document.getElementById('emailBtn');
      btn.disabled = true;
      btn.textContent = 'Working...';
      try {
        const res = await fetch('/api/screenshots/capture-and-email', { method: 'POST' });
        const data = await res.json();
        if (res.ok) { toast(data.message || 'Sent!'); loadScreenshots(); }
        else { toast(data.error || 'Failed', 'error'); }
      } catch (err) { toast('Failed', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Capture & Email'; }
    }

    async function loadScreenshots() {
      try {
        const res = await fetch('/api/screenshots');
        const files = await res.json();
        const container = document.getElementById('screenshotsList');

        if (!files.length) {
          container.innerHTML = '<div class="empty-state">No screenshots yet.</div>';
          return;
        }

        container.innerHTML = files.slice().reverse().map(f =>
          '<div class="screenshot-card">'
          + '<div class="sc-header"><span class="sc-label">' + esc(f) + '</span></div>'
          + '<img src="/screenshots/' + encodeURIComponent(f) + '" alt="' + esc(f) + '" loading="lazy" onclick="openLightbox(this.src)">'
          + '</div>'
        ).join('');
      } catch (e) { /* */ }
    }

    /* --- Email Settings --- */
    async function loadEmailSettings() {
      try {
        const res = await fetch('/api/email-settings');
        const data = await res.json();
        const form = document.getElementById('emailForm');
        form.recipient.value = data.recipient || '';
        form.smtp_user.value = data.smtp_user || '';
        form.smtp_password.value = data.smtp_password || '';
        form.smtp_host.value = data.smtp_host || 'smtp.gmail.com';
        form.smtp_port.value = data.smtp_port || 587;
      } catch (e) { /* */ }
    }

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        const res = await fetch('/api/email-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            recipient: form.recipient.value.trim(),
            smtp_user: form.smtp_user.value.trim(),
            smtp_password: form.smtp_password.value,
            smtp_host: form.smtp_host.value.trim(),
            smtp_port: parseInt(form.smtp_port.value),
          }),
        });
        if (res.ok) toast('Settings saved');
        else toast('Failed to save', 'error');
      } catch (err) { toast('Network error', 'error'); }
    });

    /* --- Balances --- */
    function formatUSD(val) {
      if (val == null || val === 0) return '$0.00';
      if (val < 0.01 && val > 0) return '<$0.01';
      return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatAmount(val) {
      if (val == null) return '--';
      if (val === 0 || val < 0.000001) return '0';
      if (val >= 1000000) return Number(val).toLocaleString('en-US', { maximumFractionDigits: 0 });
      if (val >= 1) return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
      if (val >= 0.0001) return Number(val).toFixed(6);
      return Number(val).toExponential(2);
    }

    function formatPrice(val) {
      if (!val) return '--';
      if (val >= 1) return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (val >= 0.01) return '$' + Number(val).toFixed(4);
      return '$' + Number(val).toExponential(2);
    }

    function tokenTable(rows) {
      let html = '<div style="margin-top:4px;">'
        + '<div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #2a2d31;color:#6e7681;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">'
        + '<div>Asset</div><div style="text-align:right;">Balance</div><div style="text-align:right;">Price</div><div style="text-align:right;">Value</div></div>';
      html += rows.join('');
      html += '</div>';
      return html;
    }

    function tokenRow(symbol, name, amount, price, usd) {
      return '<div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #1e2024;align-items:center;">'
        + '<div><div style="font-weight:600;font-size:0.9rem;">' + esc(symbol) + '</div>'
        + '<div style="color:#6e7681;font-size:0.7rem;">' + esc(name) + '</div></div>'
        + '<div style="text-align:right;color:#c9d1d9;font-size:0.85rem;">' + formatAmount(amount) + '</div>'
        + '<div style="text-align:right;color:#6e7681;font-size:0.85rem;">' + formatPrice(price) + '</div>'
        + '<div style="text-align:right;font-weight:600;font-size:0.85rem;">' + formatUSD(usd) + '</div></div>';
    }

    async function fetchBalances() {
      const btn = document.getElementById('balanceBtn');
      btn.disabled = true;
      btn.textContent = 'Fetching...';
      const container = document.getElementById('balancesList');
      container.innerHTML = '<div class="empty-state">Loading balances...</div>';

      try {
        const res = await fetch('/api/balances');
        const wallets = await res.json();

        if (!wallets.length) {
          container.innerHTML = '<div class="empty-state">No URLs added yet.</div>';
          return;
        }

        container.innerHTML = wallets.map(w => {
          const typeClass = w.type === 'solana' ? 'badge-jupiter' : 'badge-debank';
          const typeName = w.type === 'solana' ? 'Solana' : 'EVM';
          let inner = '';

          if (w.error) {
            inner = '<div style="color:#f85149;padding:8px 0;font-size:0.85rem;">' + esc(w.error) + '</div>';
          } else if (w.type === 'solana') {
            // Holdings section (SOL + tokens >= $1)
            let holdingsRows = [];
            if (w.sol_balance != null) {
              holdingsRows.push(tokenRow('SOL', 'Solana', w.sol_balance, w.sol_price, w.sol_usd));
            }
            if (w.tokens && w.tokens.length) {
              w.tokens.forEach(t => {
                holdingsRows.push(tokenRow(t.symbol, t.name || '', t.amount, t.price, t.usd));
              });
            }

            let holdingsTotal = (w.sol_usd || 0);
            if (w.tokens) w.tokens.forEach(t => holdingsTotal += (t.usd || 0));

            if (holdingsRows.length) {
              inner += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-top:4px;">'
                + '<div style="font-weight:600;font-size:0.85rem;color:#8b949e;">Holdings</div>'
                + '<div style="font-weight:600;font-size:0.85rem;">' + formatUSD(holdingsTotal) + '</div></div>';
              inner += tokenTable(holdingsRows);
            }

            // Other section
            if (w.other_tokens && w.other_tokens.length) {
              let otherTotal = 0;
              w.other_tokens.forEach(t => otherTotal += (t.usd || 0));
              let otherRows = [];
              w.other_tokens.forEach(t => {
                otherRows.push(tokenRow(t.symbol, t.name || '', t.amount, t.price, t.usd));
              });
              inner += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-top:12px;border-top:1px solid #2a2d31;">'
                + '<div style="font-weight:600;font-size:0.85rem;color:#8b949e;">Other</div>'
                + '<div style="font-weight:600;font-size:0.85rem;">' + formatUSD(otherTotal) + '</div></div>';
              inner += tokenTable(otherRows);
            }

            if (!holdingsRows.length && !(w.other_tokens && w.other_tokens.length)) {
              inner = '<div style="color:#484f58;font-size:0.85rem;padding:8px 0;">No tokens found</div>';
            }
          } else if (w.type === 'evm') {
            // EVM: show individual tokens if available, otherwise chains
            if (w.evm_tokens && w.evm_tokens.length) {
              let rows = [];
              w.evm_tokens.forEach(t => {
                rows.push(tokenRow(t.symbol, t.name || t.chain || '', t.amount, t.price, t.usd));
              });
              inner = tokenTable(rows);
            } else if (w.chains && w.chains.length) {
              let rows = [];
              w.chains.forEach(c => {
                rows.push(tokenRow(c.name, 'Chain', '--', '--', c.usd));
              });
              inner = tokenTable(rows);
            }
          }

          return '<div class="card">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding-bottom:12px;border-bottom:1px solid #21262d;">'
            + '<div><span class="url-badge ' + typeClass + '">' + typeName + '</span>'
            + '<div style="font-weight:600;margin-top:4px;">' + esc(w.label || '') + '</div>'
            + '<div style="font-family:monospace;font-size:0.7rem;color:#6e7681;">' + esc(w.address || '') + '</div></div>'
            + '<div style="font-size:1.4rem;font-weight:700;color:#3fb950;">' + formatUSD(w.total_usd) + '</div></div>'
            + inner + '</div>';
        }).join('');

        toast('Balances loaded');
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Failed to load balances</div>';
        toast('Failed to fetch', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Balances';
      }
    }

    /* Init */
    loadUrls();
  </script>
</body>
</html>
